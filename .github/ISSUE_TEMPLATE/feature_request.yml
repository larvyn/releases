name: Feature request
description: Suggest something Larvyn should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow or problem, not only the solution.
      placeholder: When I run my test suite I want to …
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Larvyn help?
      description: Your idea of how it could work. Mockups welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you use today?
      description: Other tools or workarounds you rely on for this.
